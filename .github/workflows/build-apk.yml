name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cherry_purse
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan folder web
        run: |
          mkdir -p www
          cp index.html www/
          cp icon.webp www/

      - name: Blokir copy dan seleksi teks
        run: |
          cat > www/lock.js << 'EOF'
          var s = document.createElement('style');
          s.textContent = '*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea{-webkit-user-select:text;user-select:text}';
          document.head.appendChild(s);
          document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
          document.addEventListener('selectstart', function (e) {
            var t = e.target;
            if (t && t.closest && t.closest('input,textarea')) return;
            e.preventDefault();
          });
          EOF
          sed -i 's#</head>#<script src="lock.js"></script></head>#' www/index.html

      - name: Install dependency
        run: npm install

      - name: Tambah platform Android
        run: npx cap add android

      - name: Aktifkan fullscreen
        run: |
          cat > android/app/src/main/java/id/masrahmat/cherrypurse/MainActivity.java << 'EOF'
          package id.masrahmat.cherrypurse;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              if (Build.VERSION.SDK_INT >= 28) {
                getWindow().getAttributes().layoutInDisplayCutoutMode =
                    WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
              }
              hideSystemBars();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) hideSystemBars();
            }

            private void hideSystemBars() {
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              WindowInsetsControllerCompat c =
                  WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.hide(WindowInsetsCompat.Type.systemBars());
              c.setSystemBarsBehavior(
                  WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
            }
          }
          EOF

      - name: Pasang ikon dari folder icon
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          put() {
            mkdir -p "$RES/mipmap-$1"
            cp "icon/Icon Cherry Purse-$2x$2.png" "$RES/mipmap-$1/ic_launcher.png"
            cp "icon/Icon Cherry Purse-$2x$2.png" "$RES/mipmap-$1/ic_launcher_round.png"
            cp "icon/Icon Cherry Purse-$2x$2.png" "$RES/mipmap-$1/ic_launcher_foreground.png"
          }
          put ldpi 36
          put mdpi 48
          put hdpi 72
          put xhdpi 96
          put xxhdpi 144
          put xxxhdpi 192

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cherry-purse-apk
          path: cherry_purse/android/app/build/outputs/apk/debug/app-debug.apk
