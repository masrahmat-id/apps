name: Build APK Cherry Purse

on:
  push:
    branches: [main]
    paths:
      - 'cherry_purse/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_DIR: cherry_purse
  APP_NAME: Cherry Purse
  APP_ID: com.masrahmat.cherrypurse

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan project Capacitor
        run: |
          mkdir -p _build/www
          cp "$APP_DIR/index.html" _build/www/index.html
          cp -r "$APP_DIR/icon" _build/www/icon
          cd _build
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "$APP_NAME" "$APP_ID" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Pasang ikon aplikasi
        run: |
          RES=_build/android/app/src/main/res
          ICON="$APP_DIR/icon"
          rm -rf "$RES/mipmap-anydpi-v26"
          copy_icon() {
            mkdir -p "$RES/$2"
            cp "$ICON/Icon Cherry Purse-$1.png" "$RES/$2/ic_launcher.png"
            cp "$ICON/Icon Cherry Purse-$1.png" "$RES/$2/ic_launcher_round.png"
            cp "$ICON/Icon Cherry Purse-$1.png" "$RES/$2/ic_launcher_foreground.png"
          }
          copy_icon 36x36   mipmap-ldpi
          copy_icon 48x48   mipmap-mdpi
          copy_icon 72x72   mipmap-hdpi
          copy_icon 96x96   mipmap-xhdpi
          copy_icon 144x144 mipmap-xxhdpi
          copy_icon 192x192 mipmap-xxxhdpi

      - name: Aktifkan fullscreen penuh, matikan copy teks & keyboard bawaan, simpan CSV ke Download/CherryPurse
        run: |
          DIR=_build/android/app/src/main/java/com/masrahmat/cherrypurse
          mkdir -p "$DIR"
          cat > "$DIR/MainActivity.java" <<'JAVA'
          package com.masrahmat.cherrypurse;

          import android.Manifest;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;

          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;

          import com.getcapacitor.BridgeActivity;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends BridgeActivity {
              private final Handler uiHandler = new Handler(Looper.getMainLooper());
              private final Runnable hideBars = new Runnable() {
                  @Override public void run() { applyImmersive(); }
              };

              @Override
              @SuppressWarnings("deprecation")
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);

                  // Fullscreen penuh: status bar (sinyal/baterai) & nav bar disembunyikan
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  getWindow().setStatusBarColor(Color.TRANSPARENT);
                  getWindow().setNavigationBarColor(Color.TRANSPARENT);
                  // Keyboard bawaan HP tidak dipakai (app punya keyboard sendiri), jangan resize layar
                  getWindow().setSoftInputMode(
                      WindowManager.LayoutParams.SOFT_INPUT_STATE_ALWAYS_HIDDEN
                      | WindowManager.LayoutParams.SOFT_INPUT_ADJUST_NOTHING);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }
                  applyImmersive();

                  // Kalau bar sempat muncul lagi (dialog tanggal, swipe, dll), sembunyikan otomatis
                  getWindow().getDecorView().setOnSystemUiVisibilityChangeListener(
                      new View.OnSystemUiVisibilityChangeListener() {
                          @Override
                          public void onSystemUiVisibilityChange(int visibility) {
                              if ((visibility & View.SYSTEM_UI_FLAG_FULLSCREEN) == 0) {
                                  uiHandler.removeCallbacks(hideBars);
                                  uiHandler.postDelayed(hideBars, 1500);
                              }
                          }
                      });

                  // Android 9 ke bawah butuh izin storage
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q
                      && ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE)
                          != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this,
                          new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE}, 1);
                  }

                  WebView wv = getBridge().getWebView();
                  // Matikan tekan-lama (menu salin/seleksi teks)
                  wv.setLongClickable(false);
                  wv.setHapticFeedbackEnabled(false);
                  wv.setOnLongClickListener(new View.OnLongClickListener() {
                      @Override public boolean onLongClick(View v) { return true; }
                  });
                  wv.addJavascriptInterface(new CsvSaver(), "AndroidSaver");
              }

              public class CsvSaver {
                  @JavascriptInterface
                  public boolean saveCsv(String fileName, String content) {
                      try {
                          byte[] data = content.getBytes(StandardCharsets.UTF_8);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentResolver r = getContentResolver();
                              ContentValues v = new ContentValues();
                              v.put(MediaStore.MediaColumns.DISPLAY_NAME, fileName);
                              v.put(MediaStore.MediaColumns.MIME_TYPE, "text/csv");
                              v.put(MediaStore.MediaColumns.RELATIVE_PATH,
                                  Environment.DIRECTORY_DOWNLOADS + "/CherryPurse");
                              Uri uri = r.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                              if (uri == null) return false;
                              try (OutputStream os = r.openOutputStream(uri)) {
                                  os.write(data);
                              }
                          } else {
                              File dir = new File(
                                  Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS),
                                  "CherryPurse");
                              if (!dir.exists()) dir.mkdirs();
                              try (FileOutputStream os = new FileOutputStream(new File(dir, fileName))) {
                                  os.write(data);
                              }
                          }
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) applyImmersive();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  applyImmersive();
              }

              private void applyImmersive() {
                  WindowInsetsControllerCompat c =
                      new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
                  c.setSystemBarsBehavior(
                      WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  c.hide(WindowInsetsCompat.Type.systemBars());
              }
          }
          JAVA

      - name: Paksa tema fullscreen (status bar & nav bar tidak muncul)
        run: |
          S=_build/android/app/src/main/res/values/styles.xml
          sed -i 's#<item name="android:background">@null</item>#<item name="android:background">@null</item>\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:statusBarColor">@android:color/transparent</item>\n        <item name="android:navigationBarColor">@android:color/transparent</item>#' "$S"
          sed -i 's#<item name="android:background">@drawable/splash</item>#<item name="android:background">@drawable/splash</item>\n        <item name="android:windowFullscreen">true</item>#' "$S"
          cat "$S"

      - name: Tambah izin storage (Android 9 ke bawah)
        run: |
          M=_build/android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <application#' "$M"

      - name: Atur versi aplikasi
        run: |
          F=_build/android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" "$F"
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" "$F"

      - name: Pakai keystore tetap (agar update tidak perlu uninstall)
        run: |
          mkdir -p ~/.android
          cp "$APP_DIR/debug.keystore" ~/.android/debug.keystore

      - name: Build APK
        working-directory: _build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Ganti nama APK
        run: cp _build/android/app/build/outputs/apk/debug/app-debug.apk Cherry-Purse.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cherry-Purse-APK
          path: Cherry-Purse.apk

      - name: Publish ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Cherry Purse v1.${{ github.run_number }}
          files: Cherry-Purse.apk
