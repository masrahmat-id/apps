name: Build Cherry Purse APK

on:
  push:
    branches: [ main ]
    paths:
      - 'cherry_purse/**'
      - '.github/workflows/build-cherry-purse.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Siapkan Proyek Capacitor & Aset
        run: |
          mkdir -p app_build/www
          cp -r cherry_purse/* app_build/www/
          cd app_build
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Cherry Purse" "com.masrahmat.cherrypurse" --web-dir=www
          npx cap add android

      - name: Atur Ikon Aplikasi dari icon.webp
        run: |
          sudo apt-get update && sudo apt-get install -y webp imagemagick
          if [ -f "cherry_purse/icon.webp" ]; then
            dwebp cherry_purse/icon.webp -o icon.png
            for dir in app_build/android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                convert icon.png -resize 192x192 "$dir/ic_launcher.png"
                convert icon.png -resize 192x192 "$dir/ic_launcher_round.png"
                convert icon.png -resize 192x192 "$dir/ic_launcher_foreground.png"
              fi
            done
          fi

      - name: Build Debug APK
        run: |
          cd app_build/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: Cherry-Purse-APK
          path: app_build/android/app/build/outputs/apk/debug/app-debug.apk
