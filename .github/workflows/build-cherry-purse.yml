name: Build Android APK (CherryPurse)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-cache: 'npm'
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project, Copy Files & Enable Fullscreen
        run: |
          cordova create cordova-app id.web.masrahmat.cherrypurse "CherryPurse"
          cd cordova-app
          cordova platform add android

          rm -rf www/*
          cp -r ../apps/cherry_purse/* www/

          if [ -f "www/index.html" ]; then
            cat << 'EOF' >> www/index.html
<script>
  (function () {
    function aktifkanFullscreen() {
      var el = document.documentElement;
      if (!document.fullscreenElement && el.requestFullscreen) {
        el.requestFullscreen().catch(function () {});
      } else if (!document.webkitFullscreenElement && el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
      }
    }
    document.addEventListener('deviceready', aktifkanFullscreen, false);
    document.addEventListener('DOMContentLoaded', aktifkanFullscreen, false);
    document.addEventListener('click', aktifkanFullscreen, false);
    document.addEventListener('touchstart', aktifkanFullscreen, { passive: true });
  })();
</script>
EOF
          fi

      - name: Build Android APK (Debug)
        run: |
          cd cordova-app
          cordova build android --debug -- --packageType=apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cherry-purse-debug-apk
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
