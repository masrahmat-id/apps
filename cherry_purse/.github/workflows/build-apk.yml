name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cherry_purse
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan folder web
        run: |
          mkdir -p www
          cp index.html www/
          cp icon.webp www/

      - name: Install dependency
        run: npm install

      - name: Tambah platform Android
        run: npx cap add android

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cherry-purse-apk
          path: cherry_purse/android/app/build/outputs/apk/debug/app-debug.apk
