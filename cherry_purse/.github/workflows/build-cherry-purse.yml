name: Build CherryPurse Cordova APK

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/cherry_purse/**'
      - '.github/workflows/build-cherry-purse.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project & copy files
        run: |
          cordova create cordova_app com.masrahmat.cherrypurse CherryPurse
          cd cordova_app
          cordova platform add android
          cordova plugin add cordova-plugin-fullscreen
          rm -rf www/*
          cp -r ../apps/cherry_purse/* www/

      - name: Write config.xml
        run: |
          cat << 'EOF' > cordova_app/config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.masrahmat.cherrypurse" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>CherryPurse</name>
              <description>CherryPurse Cordova App</description>
              <author email="masrahmat.id@gmail.com">Mas Rahmat</author>

              <content src="index.html" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />

              <platform name="android">
                  <preference name="Fullscreen" value="true" />
                  <preference name="KeepRunning" value="true" />
              </platform>
          </widget>
          EOF

      - name: Build Android APK
        run: |
          cd cordova_app
          cordova prepare android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CherryPurse-APK
          path: cordova_app/platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
